name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test EnbMaps.Tests

      # Builds data/normalized/enbmaps.json from the archived pages and copies it, plus the original images, into wwwroot.
      - name: Extract dataset
        run: dotnet run --project EnbMaps.Tools -- extract

      - name: Publish
        run: dotnet publish EnbMaps/EnbMaps.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish/wwwroot
          force_orphan: true
