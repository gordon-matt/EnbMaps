<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>[enbmaps.de] Earth &amp; Beyond Maps</title>
    <script>
        // GitHub Pages serves this file for unknown paths (deep links such as /EnbMaps/map/Earth).
        // Remember the requested URL and load the app root, which restores it (see index.html).
        (function () {
            var segments = location.pathname.split('/');
            var base = location.hostname.endsWith('github.io') && segments.length > 2 ? '/' + segments[1] + '/' : '/';
            sessionStorage.setItem('enbmaps-redirect', location.pathname + location.search + location.hash);
            location.replace(base);
        })();
    </script>
</head>
<body></body>
</html>
