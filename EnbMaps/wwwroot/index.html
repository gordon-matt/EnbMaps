<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Stefan Schleusener aka Dodger (original enbmaps.de)" />
    <meta name="description" content="Archived and modernized copy of enbmaps.de - interactive maps for Earth &amp; Beyond." />
    <meta name="theme-color" content="#2F3C5F" />
    <title>[enbmaps.de] Earth &amp; Beyond Maps</title>
    <base href="/" />
    <script>
        // GitHub Pages fallback: 404.html stores the requested deep link, restore it before Blazor routes.
        (function () {
            var redirect = sessionStorage.getItem('enbmaps-redirect');
            if (redirect) {
                sessionStorage.removeItem('enbmaps-redirect');
                history.replaceState(null, '', redirect);
            }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
